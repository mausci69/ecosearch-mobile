version: "3.9"

services:
  backend:
    build: ./backend
    container_name: ecosearch_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app

  frontend:
    build: ./web
    container_name: ecosearch_frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./web:/app
    depends_on:
      - backend

